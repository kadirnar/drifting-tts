name: DriftingTTSApp
options:
  bundleIdPrefix: com.kadirnar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"
packages:
  DriftingTTS:
    path: ../swift/DriftingTTS
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  DriftingTTSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DriftingTTSApp
    dependencies:
      - package: DriftingTTS
        product: DriftingTTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadirnar.DriftingTTSApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Drifting TTS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
      run:
        config: Debug
      profile:
        config: Release
