# Fine-tune Vocos on the BigVGAN mels of a trained TTS model (ground-truth alignment). The ISTFT head switches to
# `same` padding so that F mel frames map to F * 256 samples, aligned as BigVGAN's uncentred frames.
data:
  root: data/train          # needs `drifting-tts prepare --backend bigvgan --save-audio`
  min_quality: 60
  max_frames: 1500

tts:
  path: runs/tts_v3/model_ema.pt   # trained on bigvgan mels

vocoder:
  arch: vocos
  init: charactr/vocos-mel-24khz   # pretrained Vocos; its input layer adapts to our mels during fine-tuning

train:
  seed: 0
  steps: 40000
  batch_size: 16
  batch_frames: 24000
  segment_frames: 64       # 64 mel frames <-> 16384 samples
  gta_prob: 0.8            # fraction of batches with generated mels (the rest: recorded mels)
  gta_temperature: 0.3     # noise temperature of the generated mels (the released model's)
  lr: 0.0001
  grad_clip: 10.0
  mel_loss_coeff: 45.0
  mrd_loss_coeff: 0.1
  disc_warmup_steps: 2000  # train the fresh discriminators first, generator frozen
  num_workers: 4
  log_every: 100
  sample_every: 5000
  num_samples: 2
  save_every: 2500
