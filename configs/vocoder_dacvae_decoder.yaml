# Fine-tune the DAC-VAE decoder on latents generated by the trained latent TTS model (ground-truth alignment, "GTA";
# issue #32): the recipe of configs/vocoder_voxcpm2_decoder.yaml (#27) for DAC-VAE's non-causal, watermarked decoder.
# Only the decoder's audio path is trained. The watermark stays frozen and is added to every output, as at release.
data:
  root: data/train_dacvae  # `drifting-tts extract-latents --backend dacvae` (audio.bin linked from the source root)
  min_quality: 0
  max_frames: 1500

tts:
  path: runs/tts_dacvae/model_ema.pt  # trained on dacvae latents (the backend is stored in the checkpoint)

vocoder:
  backend: dacvae
  arch: vae_decoder                 # the VAE's own decoder (released weights), trained in place of a vocoder
  weight_norm: true                 # train the audio path with weight norm, as the VAE was; folded on export
  repo: nvidia/bigvgan_v2_24khz_100band_256x
  pretrained_discriminators: true   # released MPD + CQT-D (24 kHz), bigvgan_discriminator_optimizer.pt
  pretrained_optimizer: true        # ... and their AdamW moments (the decoder's optimizer starts fresh)
  hparams: {}                       # discriminator config.json overrides

train:
  seed: 0
  steps: 40000
  batch_size: 8            # utterances per batch, one segment each
  batch_frames: 24000
  segment_frames: 16       # VAE frames (25 Hz) per segment: 0.64 s, 15360 samples at 24 kHz
  context_frames: 8        # left context of the non-causal decoder
  right_context_frames: 8  # ... and right context
  gta_prob: 0.8            # fraction of batches with generated latents (the rest: the recordings' latents)
  gta_temperature: 0.3     # noise temperature of the generated latents (as at inference)
  gta_cfg: 2.0             # guidance scale of the generated latents (as at inference)
  lr: 5.0e-5               # decoder and discriminators
  lr_decay: 0.99999        # per step
  warmup_steps: 1000       # linear warmup of the decoder's learning rate (its optimizer starts fresh)
  betas: [0.8, 0.99]
  grad_clip: 500.0
  mel_loss_coeff: 15.0     # multi-scale mel L1 at 24 kHz
  disc_warmup_steps: 0
  bf16_disc: false
  num_workers: 3
  log_every: 100
  sample_every: 2500       # TensorBoard audio: GTA / recorded-latent decoding of validation utterances
  num_samples: 2
  save_every: 2500
  keep_snapshots: true     # every export also as decoder_ft_<step>.pt
