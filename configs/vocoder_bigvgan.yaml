# Fine-tune BigVGAN-v2 on mels generated by the trained TTS model (ground-truth alignment), resuming NVIDIA's
# released generator *and* discriminators + optimizer states (what the official recipe does for fine-tuning)
data:
  root: data/train  # `drifting-tts prepare --backend bigvgan --save-audio`
  min_quality: 60
  max_frames: 1500

tts:
  path: runs/tts_bigvgan/model_ema.pt  # trained on bigvgan mels (the backend is stored in the checkpoint)

vocoder:
  backend: bigvgan
  repo: nvidia/bigvgan_v2_24khz_100band_256x
  pretrained: true                  # released generator (bigvgan_generator.pt, step 5M)
  pretrained_discriminators: true   # released MPD + CQT-D (bigvgan_discriminator_optimizer.pt, 1.4 GB)
  pretrained_optimizer: true        # ... and the AdamW moments of both (learning rate below replaces theirs)
  hparams: {}                       # config.json overrides (architecture changes need pretrained*: false)

train:
  seed: 0
  steps: 100000
  batch_size: 4            # 4 x 16384 samples: 11.2 GB on an RTX 5090 with compile (8: ~20 GB steady state, extrapolated)
  batch_frames: 24000
  segment_frames: 64       # 64 mel frames <-> 16384 samples (official: 256 frames = 65536 samples x 4 per GPU)
  gta_prob: 0.8            # fraction of batches with generated mels (the rest: recorded mels)
  gta_temperature: 0.5     # noise temperature used for the generated mels (match inference)
  lr: 1.35e-5              # = 1e-4 * 0.9999996^5M: where the released LR schedule ended (stored in the optimizer)
  lr_decay: 0.9999996      # per step, as in config.json (-4% over 100k steps)
  betas: [0.8, 0.99]       # adam_b1 / adam_b2 of config.json
  grad_clip: 500.0         # clip_grad_norm of config.json (generator, MPD and CQT-D separately)
  mel_loss_coeff: 15.0     # lambda_melloss (multi-scale mel L1)
  disc_warmup_steps: 0     # the released discriminators need no warm-up
  compile: true            # torch.compile the anti-aliased activations: -25% memory, +35% it/s (~2 min to compile)
  bf16_disc: false         # bf16 discriminators distort the feature-matching gradient (docs/TRAINING.md); G is fp32
  num_workers: 4
  log_every: 100
  sample_every: 5000       # TensorBoard audio: GTA / recorded-mel vocoding of validation utterances
  num_samples: 2
  save_every: 2500
