# Fine-tune the VoxCPM2 AudioVAE decoder on latents generated by the trained latent TTS model (ground-truth
# alignment, "GTA"; issue #27): the latent counterpart of configs/vocoder_bigvgan.yaml. The decoder replaces the
# vocoder of a model trained on VAE latents; the recipe is BigVGAN-v2's, with NVIDIA's released 24 kHz discriminators.
data:
  root: data/train_voxcpm2  # `drifting-tts extract-latents --backend voxcpm2` (audio.bin linked from the source root)
  min_quality: 0
  max_frames: 1500

tts:
  path: runs/tts_voxcpm2/model_ema.pt  # trained on voxcpm2 latents (the backend is stored in the checkpoint)

vocoder:
  backend: voxcpm2
  arch: vae_decoder                 # the VAE's own decoder (released weights), trained in place of a vocoder
  target_rate: 48000                # VoxCPM2's output-bandwidth condition, as it decodes (stored in decoder_ft.pt)
  weight_norm: true                 # train with weight norm on every convolution, as the VAE was; folded on export
  repo: nvidia/bigvgan_v2_24khz_100band_256x
  pretrained_discriminators: true   # released MPD + CQT-D (24 kHz), bigvgan_discriminator_optimizer.pt
  pretrained_optimizer: true        # ... and their AdamW moments (the decoder's optimizer starts fresh)
  hparams: {}                       # discriminator config.json overrides

train:
  seed: 0
  steps: 20000
  batch_size: 8            # utterances per batch, one segment each
  batch_frames: 24000
  segment_frames: 16       # VAE frames (25 Hz) per segment: 0.64 s, 15360 samples at 24 kHz
  context_frames: 12       # left context of the causal decoder (480 ms: within 80 dB of whole-utterance decoding)
  gta_prob: 0.8            # fraction of batches with generated latents (the rest: the recordings' latents)
  gta_temperature: 0.3     # noise temperature of the generated latents (as at inference)
  gta_cfg: 2.0             # guidance scale of the generated latents (as at inference)
  lr: 5.0e-5               # decoder and discriminators
  lr_decay: 0.99999        # per step
  warmup_steps: 1000       # linear warmup of the decoder's learning rate (its optimizer starts fresh)
  betas: [0.8, 0.99]
  grad_clip: 500.0
  mel_loss_coeff: 15.0     # multi-scale mel L1 at 24 kHz
  disc_warmup_steps: 0
  bf16_disc: false
  num_workers: 3
  log_every: 100
  sample_every: 2500       # TensorBoard audio: GTA / recorded-latent decoding of validation utterances
  num_samples: 2
  save_every: 2500
