# Fine-tune Vocos on mels generated by the trained TTS model (ground-truth alignment)
data:
  root: data/train          # needs `drifting-tts prepare --save-audio`
  min_quality: 60
  max_frames: 1500

tts:
  path: runs/tts/model_ema.pt

vocoder:
  init: charactr/vocos-mel-24khz   # HF repo id (pretrained) or a local Vocos YAML config

train:
  seed: 0
  steps: 50000
  batch_size: 16
  batch_frames: 24000
  segment_frames: 65       # 65 mel frames <-> 16384 samples, as in the Vocos recipe
  gta_prob: 0.8            # fraction of batches with generated mels (the rest: recorded mels)
  gta_temperature: 0.5     # noise temperature used for the generated mels (match inference)
  lr: 0.00005
  grad_clip: 10.0
  mel_loss_coeff: 45.0
  mrd_loss_coeff: 0.1
  disc_warmup_steps: 2000  # train the fresh discriminators first, generator frozen
  num_workers: 4
  log_every: 100
  save_every: 2500
